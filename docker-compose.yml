services:

  # ─────────────────────────────────────────────────────────────
  # Service 1: MongoDB Database
  # ─────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: voice-agent-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - voice-network

  # ─────────────────────────────────────────────────────────────
  # Service 2: Voice Engine (Express.js)
  # ─────────────────────────────────────────────────────────────
  voice-engine:
    build:
      context: ./voice-engine
      dockerfile: Dockerfile
    container_name: voice-agent-engine
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - ./voice-engine/.env
    depends_on:
      - mongodb
    volumes:
      # Mount source code live so nodemon picks up file changes
      - ./voice-engine:/app
      # Prevent host node_modules from overwriting container's node_modules
      - /app/node_modules
    extra_hosts:
      - "api.deepgram.com:208.184.56.200"
      - "api.elevenlabs.io:34.8.184.191"
      - "api.groq.com:104.18.38.236"
    networks:
      - voice-network

  # ─────────────────────────────────────────────────────────────
  # Service 3: Analytics Dashboard (Next.js)
  # ─────────────────────────────────────────────────────────────
  analytics-dashboard:
    build:
      context: ./analytics-dashboard
      dockerfile: Dockerfile
    container_name: voice-agent-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/voice-agent-telemetry
      - VOICE_ENGINE_URL=http://voice-engine:5050
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-super-secret-random-key-here
    depends_on:
      - mongodb
      - voice-engine
    networks:
      - voice-network

  # ─────────────────────────────────────────────────────────────
  # Service 4: ngrok Tunnel (Auto-exposes voice-engine to internet)
  # ─────────────────────────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    container_name: voice-agent-ngrok
    restart: unless-stopped
    command: >
      http voice-engine:5050 --log=stdout
    env_file:
      - ./voice-engine/.env
    ports:
      # Expose ngrok's web inspection UI at http://localhost:4040
      - "4040:4040"
    depends_on:
      - voice-engine
    networks:
      - voice-network

# ─────────────────────────────────────────────────────────────
# Named volume for MongoDB data persistence
# ─────────────────────────────────────────────────────────────
volumes:
  mongo_data:

    # ─────────────────────────────────────────────────────────────
    # Internal Docker network so all services can talk to each other
    # ─────────────────────────────────────────────────────────────
networks:
  voice-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
